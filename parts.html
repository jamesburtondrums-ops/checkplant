<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KCM Parts Purchasing Hub</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;font:15px system-ui;color:#182437}header{background:#25276f;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header a{color:white}main{max-width:1200px;margin:auto;padding:18px}h1{font-size:24px;margin:0}h2{margin:0 0 12px}h3{margin:0}p{line-height:1.5}button,input,select{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px}button{cursor:pointer;background:#fff;margin:3px}button:hover,button.active{background:#25276f;color:white}nav{display:flex;flex-wrap:wrap;margin-bottom:16px}article,.panel,#login{background:white;padding:18px;border:1px solid #dce3eb;border-radius:12px;margin-bottom:12px}.pill{font-size:12px;background:#e8eef5;padding:4px 8px;border-radius:10px}#message{color:#135e39;font-weight:700;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}input{max-width:100%}[hidden]{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.order-modal{position:fixed;inset:0;background:#182437aa;z-index:100;overflow:auto;padding:20px}.order-sheet{max-width:1100px;margin:auto;background:white;padding:22px;border-radius:14px}.order-line{display:grid;grid-template-columns:2fr 1.3fr .6fr 1fr .8fr auto;gap:8px;align-items:end;border-bottom:1px solid #ddd;padding:10px 0}.order-line label{font-size:12px;font-weight:650}.order-line input{display:block;width:100%;margin-top:4px}.line-total{display:block;padding:10px 0}.order-sheet label{display:block}.order-sheet .toolbar label{flex:1;min-width:150px}.order-sheet .toolbar select,.order-sheet .toolbar input{width:100%}#orderError{color:#a21b1b;font-weight:700}@media(max-width:700px){.order-line{grid-template-columns:1fr 1fr}.order-modal{padding:8px}.order-sheet{padding:12px}}</style></head><body><header><h1>Parts Purchasing Hub</h1><a href="./">CheckPlant</a></header><main><div id="message" role="status"></div><section id="login"><h2>Manager sign in</h2><input id="pin" type="password" inputmode="numeric" placeholder="Back Office PIN" onkeydown="if(event.key==='Enter')unlock()"><button onclick="unlock()">Sign in</button></section><div id="workspace" hidden><p id="stats"></p><div id="stockWarnings" role="status"></div><nav><button class="active" data-tab="requests" onclick="tab('requests')">Requests</button><button data-tab="suppliers" onclick="tab('suppliers')">Suppliers</button><button data-tab="catalogue" onclick="tab('catalogue')">Pricing catalogue</button><button data-tab="stock" onclick="tab('stock')">Stock register</button><button data-tab="kits" onclick="tab('kits')">Service kits</button><button data-tab="imports" onclick="tab('imports')">Import CSV</button><button onclick="location.reload()">Sign out</button></nav><section id="requests" class="panel"><h2>Purchasing requests</h2><div class="toolbar"><input id="search" placeholder="Search machine, part, job, supplier…" oninput="render()"><select id="status" onchange="render()"><option value="open">Outstanding</option><option value="all">All</option><option value="requested">Requested</option><option value="ordered">Ordered</option><option value="received">Received</option><option value="cancelled">Cancelled</option></select></div><div id="requestsList"></div></section><section id="suppliers" class="panel" hidden><h2>Supplier directory</h2><button onclick="cpEditSupplier()">Add supplier</button><div id="suppliersList"></div></section><section id="catalogue" class="panel" hidden><h2>Supplier pricing — excluding VAT</h2><button onclick="editPrice()">Add price</button><input id="priceSearch" placeholder="Search part or supplier" oninput="render()"><div id="priceList"></div></section><section id="stock" class="panel" hidden><h2>Stocked parts</h2><button onclick="cpAddStock()">Add stocked part</button><div id="stockList"></div></section><section id="kits" class="panel" hidden><h2>Machine service kits</h2><select id="cpKitMachine"></select><button onclick="cpEditServiceKit()">Add / Edit Service Kit</button><div id="cpKitRegister"></div></section><section id="imports" class="panel" hidden><h2>Bulk import</h2><p>Export spreadsheets to UTF-8 CSV. Import suppliers first, then supplier prices. Prices are excluding VAT.</p><button onclick="template('supplier')">Supplier CSV template</button><button onclick="template('price')">Pricing CSV template</button><p><input id="csvFile" type="file" accept=".csv,text/csv"></p><button onclick="previewImport('supplier')">Preview suppliers</button><button onclick="previewImport('price')">Preview prices</button><pre id="importPreview"></pre><button id="importConfirm" disabled onclick="applyImport()">Confirm import</button></section></div></main><div id="orderModal" class="order-modal" hidden><section class="order-sheet"><button style="float:right" onclick="closeOrder()">Close</button><h2 id="orderTitle"></h2><p id="orderContext"></p><div class="toolbar"><label>Supplier<select id="orderSupplier" onchange="suggestPrices()"></select></label><label>Status<select id="orderStatus"></select></label><label>Delivery £ ex VAT<input id="orderDelivery" type="number" min="0" step="0.01" oninput="calcOrder()"></label></div><div id="orderLines"></div><button id="orderAdd" onclick="addOrderLine()">+ Add line</button><h3 id="orderTotal"></h3><p id="orderError" role="alert"></p><button id="orderSave" class="active" onclick="saveOrder()">Save Request</button></section></div><script>
const firebaseConfig={apiKey:"AIzaSyD60Z04IRIvv-EaSyPzoA33fEQ3yT6wsQQ",authDomain:"checkplant-kcm.firebaseapp.com",projectId:"checkplant-kcm",storageBucket:"checkplant-kcm.firebasestorage.app",messagingSenderId:"492245064396",appId:"1:492245064396:web:c79e64b32b9856766bc069"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let backOfficeUnlocked=false,cpPartRequests=[],cpSuppliers=[],cpStockParts=[],machines=[],prices=[];
const $=id=>document.getElementById(id),cpEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cpMoney=v=>'£'+(Number(v)||0).toFixed(2),norm=v=>String(v||'').trim().toLowerCase(),cpNorm=v=>String(v||'').replace(/[^a-z0-9]/gi,'').toUpperCase();
const cpIsStocked=n=>cpNorm(n)&&cpStockParts.some(p=>cpNorm(p.partNumber)===cpNorm(n));
function toast(t){$('message').textContent=t;}
async function unlock(){try{const p=await db.collection('settings').doc('backoffice').get();if(!p.exists||!p.data().pin||String(p.data().pin)!==$('pin').value.trim())return toast('Incorrect manager PIN or PIN not configured');backOfficeUnlocked=true;$('login').hidden=true;$('workspace').hidden=false;$('pin').value='';toast('Purchasing hub connected');for(const [collection,assign] of [['partRequests',v=>cpPartRequests=v],['partSuppliers',v=>cpSuppliers=v],['stockedParts',v=>cpStockParts=v],['machines',v=>machines=v],['supplierPrices',v=>prices=v]])db.collection(collection).onSnapshot(s=>{assign(s.docs.map(d=>({id:d.id,...d.data()})));render();},e=>toast(collection+': '+e.message));}catch(e){toast(e.message);}}
function tab(id){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));}
function button(fn,id,label){return '<button onclick="'+fn+'('+cpEsc(JSON.stringify(id))+')">'+label+'</button>';}
function render(){if(!backOfficeUnlocked)return;const q=norm($('search').value),status=$('status').value;
 const list=cpPartRequests.filter(r=>(status==='all'||(status==='open'?!['received','cancelled'].includes(r.status):r.status===status))&&(!q||norm([r.machineName,r.partName,r.partNumber,r.supplierName,r.jobId,r.engineerName,...requestLines(r).map(l=>l.partName+' '+l.partNumber)].join(' ')).includes(q))).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 $('stats').textContent=cpPartRequests.filter(r=>!['received','cancelled'].includes(r.status)).length+' outstanding • '+cpPartRequests.filter(r=>r.status==='received').length+' received • Consumables & tools received: '+cpMoney(cpPartRequests.filter(r=>r.requestType==='consumables_tools'&&r.status==='received').reduce((a,r)=>a+(Number(r.totalCost)||0),0))+' • Stock replenishment received: '+cpMoney(cpPartRequests.filter(r=>r.requestType==='stock_replenishment'&&r.status==='received').reduce((a,r)=>a+(Number(r.totalCost)||0),0));
 $('requestsList').innerHTML=list.map(r=>'<article><h3>'+cpEsc(r.partName)+' × '+cpEsc(r.quantity)+(requestLines(r).length>1?' + '+(requestLines(r).length-1)+' more lines':'')+' <span class="pill">'+cpEsc(r.status)+'</span></h3><p>'+cpEsc(r.machineName)+' • '+cpEsc(r.jobId)+' • '+cpEsc(r.engineerName)+'<br>Part no: '+cpEsc(r.partNumber||'Unknown')+' • Serial: '+cpEsc(r.serialNumber||'—')+' • '+cpEsc(r.priority||'normal')+'<br>'+cpEsc(r.notes||'')+'</p><p>Supplier: '+cpEsc(r.supplierName||'Pending')+' • Total: '+(r.totalCost==null?'Pending':cpMoney(r.totalCost))+(r.jobCostAlreadyPosted?' • Service kit already charged':'')+'</p>'+(['received','cancelled'].includes(r.status)?button('cpManageRequest',r.id,'View Request'):button('cpManageRequest',r.id,'Open / Edit Request')+button('cpCancelRequest',r.id,'Cancel'))+'</article>').join('')||'<p>No matching requests.</p>';
 $('suppliersList').innerHTML=cpSuppliers.map(r=>'<article><h3>'+cpEsc(r.name)+'</h3><p>'+cpEsc([r.contact,r.phone,r.email,r.website,r.notes].filter(Boolean).join(' • '))+'</p>'+button('cpEditSupplier',r.id,'Edit')+button('cpDeleteSupplier',r.id,'Remove')+'</article>').join('');
 const low=cpStockParts.filter(p=>Number(p.quantityOnHand||0)<=Number(p.minimumStock??2));
 $('stockWarnings').innerHTML=low.length?'<article style="background:#fff2d8;border-color:#d97706;color:#854d0e"><strong>Low stock warning — '+low.length+' item(s)</strong><p>'+low.map(p=>cpEsc(p.partNumber)+' ('+Number(p.quantityOnHand||0)+' left; minimum '+Number(p.minimumStock??2)+')').join(' · ')+'</p><button onclick="tab(\'stock\')">View stock register</button></article>':'';
 $('stockList').innerHTML=cpStockParts.map(r=>'<article><strong>'+cpEsc(r.partNumber)+' — '+cpEsc(r.description||'')+'</strong><p>Available: <strong>'+Number(r.quantityOnHand||0)+'</strong> · Minimum: '+Number(r.minimumStock??2)+' · Unit cost: '+cpMoney(r.averageUnitCost)+' '+(Number(r.quantityOnHand||0)<=Number(r.minimumStock??2)?'<span style="color:#a21b1b;font-weight:bold">'+(Number(r.quantityOnHand||0)===0?'OUT OF STOCK':'LOW STOCK')+'</span>':'')+'</p>'+button('cpEditStock',r.id,'Adjust stock / minimum')+' '+button('cpRemoveStock',r.id,'Remove')+'</article>').join('');
 const pq=norm($('priceSearch').value);$('priceList').innerHTML=prices.filter(p=>!pq||norm([p.partNumber,p.description,p.supplierName].join(' ')).includes(pq)).slice(0,300).map(p=>'<article><b>'+cpEsc(p.partNumber)+' — '+cpEsc(p.description||'')+'</b><p>'+cpEsc(p.supplierName)+' • '+cpMoney(p.unitCost)+' ex VAT</p>'+button('editPrice',p.id,'Edit')+button('deletePrice',p.id,'Remove')+'</article>').join('')||'<p>No matching prices.</p>';
 cpRenderKitRegister();}
function findPrice(r,supplierId){return prices.find(p=>p.supplierId===supplierId&&cpNorm(p.partNumber)&&cpNorm(p.partNumber)===cpNorm(r.partNumber))?.unitCost;}
function chooseSupplier(){const n=prompt(cpSuppliers.map((s,i)=>(i+1)+'. '+s.name).join('\n')+'\nEnter supplier number');return n===null?null:cpSuppliers[Number(n)-1];}
async function editPrice(id){if(!backOfficeUnlocked)return;const old=prices.find(p=>p.id===id)||{};const supplier=chooseSupplier();if(!supplier)return;const partNumber=prompt('Part number',old.partNumber||'');if(!partNumber?.trim())return;const description=prompt('Description',old.description||'');if(description===null)return;const raw=prompt('Unit cost excluding VAT',old.unitCost??'');if(raw===null||!raw.trim()||!Number.isFinite(Number(raw))||Number(raw)<0)return toast('Invalid price');try{await db.collection('supplierPrices').doc(id||db.collection('supplierPrices').doc().id).set({supplierId:supplier.id,supplierName:supplier.name,partNumber:partNumber.trim(),description,unitCost:Number(raw),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Price saved');}catch(e){toast(e.message);}}
async function deletePrice(id){if(backOfficeUnlocked&&confirm('Remove this catalogue price?'))try{await db.collection('supplierPrices').doc(id).delete();}catch(e){toast(e.message);}}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}else field+=c;}if(quoted)throw Error('Unclosed CSV quotation');if(field||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()));}
let pendingImport=null;
async function previewImport(kind){pendingImport=null;$('importConfirm').disabled=true;try{const file=$('csvFile').files[0];if(!file)throw Error('Choose a CSV file first');const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(rows.length<2)throw Error('No data rows');const headers=rows.shift().map(h=>norm(h).replace(/[^a-z0-9]/g,''));const required=kind==='supplier'?['name']:['supplier','partnumber','unitcost'];if(required.some(h=>!headers.includes(h)))throw Error('Required columns: '+required.join(', '));const entries=[],errors=[];const seen=new Set();for(const [i,row] of rows.entries()){const o=Object.fromEntries(headers.map((h,j)=>[h,(row[j]||'').trim()]));let key=kind==='supplier'?norm(o.name):norm(o.supplier)+'|'+cpNorm(o.partnumber);if(kind==='supplier'&&!o.name||kind==='price'&&(!o.partnumber||!o.unitcost||!Number.isFinite(Number(o.unitcost))||Number(o.unitcost)<0||!cpSuppliers.some(s=>norm(s.name)===norm(o.supplier)))){errors.push('Row '+(i+2)+': missing/invalid fields or unknown supplier');continue;}if(seen.has(key)){errors.push('Row '+(i+2)+': duplicate key');continue;}seen.add(key);entries.push(o);}if(errors.length)throw Error(errors.slice(0,12).join('\n')+' — no rows imported');pendingImport={kind,entries};$('importPreview').textContent=entries.length+' valid rows. Existing matching entries will be updated; others added. '+JSON.stringify(entries.slice(0,3),null,2);$('importConfirm').disabled=false;}catch(e){$('importPreview').textContent=e.message;}}
async function applyImport(){if(!backOfficeUnlocked||!pendingImport)return;const {kind,entries}=pendingImport;$('importConfirm').disabled=true;let count=0;try{for(let i=0;i<entries.length;i+=200){const batch=db.batch();for(const o of entries.slice(i,i+200)){let collection,data,old;if(kind==='supplier'){collection='partSuppliers';old=cpSuppliers.find(s=>norm(s.name)===norm(o.name));data={name:o.name};for(const k of ['contact','phone','email','website','notes','address','accountreference'])if(Object.hasOwn(o,k))data[k]=o[k];}else{collection='supplierPrices';const supplier=cpSuppliers.find(s=>norm(s.name)===norm(o.supplier));if(!supplier)throw Error('Supplier changed; preview again');old=prices.find(p=>p.supplierId===supplier.id&&cpNorm(p.partNumber)===cpNorm(o.partnumber));data={supplierId:supplier.id,supplierName:supplier.name,partNumber:o.partnumber,unitCost:Number(o.unitcost)};if(Object.hasOwn(o,'description'))data.description=o.description;}batch.set(db.collection(collection).doc(old?.id||db.collection(collection).doc().id),{...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}await batch.commit();count+=Math.min(200,entries.length-i);}toast(count+' rows imported');pendingImport=null;$('importPreview').textContent='Import complete';}catch(e){toast(count+' rows saved before failure: '+e.message+' — preview again before retrying');}}
function template(kind){const text=kind==='supplier'?'name,contact,phone,email,website,address,accountreference,notes\n':'supplier,partnumber,description,unitcost\n';const u=URL.createObjectURL(new Blob([text],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download=kind+'-template.csv';a.click();URL.revokeObjectURL(u);}

let editingRequest=null;
function requestLines(r){return Array.isArray(r.lines)&&r.lines.length?r.lines:[{partName:r.partName||'',partNumber:r.partNumber||'',quantity:r.quantity||1,unitCost:r.unitCost??null}];}
function cpManageRequest(id){
 if(!backOfficeUnlocked)return toast('Manager sign-in required');
 const r=cpPartRequests.find(x=>x.id===id);if(!r)return;
 editingRequest=r;const locked=['received','cancelled'].includes(r.status);
 $('orderTitle').textContent=(r.jobId||'Request')+' — '+(r.machineName||'Purchasing');
 $('orderContext').textContent='Requested by '+(r.engineerName||'Unknown')+' • '+(r.notes||'No additional notes');
 $('orderSupplier').innerHTML='<option value="">Select supplier</option>'+cpSuppliers.map(p=>'<option value="'+cpEsc(p.id)+'">'+cpEsc(p.name)+'</option>').join('');
 if(r.supplierId&&!cpSuppliers.some(p=>p.id===r.supplierId))$('orderSupplier').add(new Option(r.supplierName||'Previous supplier',r.supplierId));
 $('orderSupplier').value=r.supplierId||'';$('orderDelivery').value=r.deliveryCost||0;
 $('orderStatus').innerHTML=(locked?[r.status]:['requested','ordered','received']).map(v=>'<option value="'+v+'">'+v+'</option>').join('');$('orderStatus').value=r.status||'requested';
 $('orderLines').replaceChildren();requestLines(r).forEach(l=>addOrderLine(l));
 $('orderAdd').hidden=locked||r.requestType==='service_kit_replenishment';$('orderSave').hidden=locked;$('orderError').textContent='';
 $('orderSupplier').disabled=$('orderDelivery').disabled=$('orderStatus').disabled=locked;
 $('orderModal').hidden=false;calcOrder();
}
function addOrderLine(l={}){
 const row=document.createElement('div');row.className='order-line';
 row.innerHTML='<label>Description<input class="line-name" placeholder="Part description"></label><label>Part number<input class="line-number" placeholder="Optional"></label><label>Qty<input class="line-qty" type="number" min="1" step="1"></label><label>Unit £ ex VAT<input class="line-price" type="number" min="0" step="0.01" placeholder="Pending"></label><div><small>Line total</small><strong class="line-total">—</strong></div><button type="button" class="line-remove">Remove</button>';
 row.querySelector('.line-name').value=l.partName||'';row.querySelector('.line-number').value=l.partNumber||'';row.querySelector('.line-qty').value=l.quantity||1;row.querySelector('.line-price').value=l.unitCost??'';
 const locked=['received','cancelled'].includes(editingRequest?.status);row.querySelectorAll('input').forEach(e=>{e.disabled=locked;e.oninput=calcOrder;});
 if(editingRequest?.requestType==='service_kit_replenishment'){row.querySelector('.line-name').readOnly=true;row.querySelector('.line-number').readOnly=true;row.querySelector('.line-qty').readOnly=true;}
 row.querySelector('.line-remove').hidden=locked||editingRequest?.requestType==='service_kit_replenishment';row.querySelector('.line-remove').onclick=()=>{if($('orderLines').children.length<=1)return;row.remove();calcOrder();};
 row.querySelector('.line-number').onchange=()=>suggestPrices();$('orderLines').append(row);calcOrder();
}
function suggestPrices(){for(const row of $('orderLines').children){const price=row.querySelector('.line-price');if(price.value===''){const p=findPrice({partNumber:row.querySelector('.line-number').value},$('orderSupplier').value);if(p!=null)price.value=p;}}calcOrder();}
function readOrderLines(){return [...$('orderLines').children].map(row=>{const raw=row.querySelector('.line-price').value,qty=Number(row.querySelector('.line-qty').value),unitCost=raw===''?null:Number(raw);return {partName:row.querySelector('.line-name').value.trim(),partNumber:row.querySelector('.line-number').value.trim(),quantity:qty,unitCost,lineTotal:unitCost===null?null:Math.round(unitCost*qty*100)/100};});}
function calcOrder(){const lines=readOrderLines();[...$('orderLines').children].forEach((row,i)=>row.querySelector('.line-total').textContent=lines[i].lineTotal===null?'Pending':cpMoney(lines[i].lineTotal));const subtotal=lines.reduce((a,l)=>a+(l.lineTotal||0),0);$('orderTotal').textContent=(lines.some(l=>l.unitCost===null)?'Known total: ':'Total: ')+cpMoney(subtotal+(Number($('orderDelivery').value)||0))+' ex VAT';}
function closeOrder(){if($('orderSave').disabled)return;$('orderModal').hidden=true;editingRequest=null;}
async function saveOrder(){
 const r=editingRequest;if(!backOfficeUnlocked||!r||['received','cancelled'].includes(r.status))return;const id=r.id,lines=readOrderLines(),status=$('orderStatus').value,delivery=Number($('orderDelivery').value),supplierId=$('orderSupplier').value,supplier=cpSuppliers.find(p=>p.id===supplierId);
 const fail=t=>$('orderError').textContent=t;
 if(!lines.length||lines.length>100||lines.some(l=>!l.partName||!Number.isInteger(l.quantity)||l.quantity<1||l.unitCost!==null&&(!Number.isFinite(l.unitCost)||l.unitCost<0)))return fail('Enter a description, valid quantity and non-negative price for each line (maximum 100).');
 if(!Number.isFinite(delivery)||delivery<0)return fail('Enter valid delivery cost.');
 if(!supplierId&&status!=='requested')return fail('Select supplier before ordering.');
 if(status==='received'&&lines.some(l=>l.unitCost===null))return fail('Enter every line price before receiving.');
 if(status==='received'&&!confirm('Receive the entire order and post its costs? Received orders cannot be edited.'))return;
 const total=lines.some(l=>l.unitCost===null)?null:Math.round((lines.reduce((a,l)=>a+l.lineTotal,0)+delivery)*100)/100;
 const unit=lines.length===1?lines[0].unitCost:null;
 const update={lines,partName:lines[0].partName,partNumber:lines[0].partNumber,quantity:lines[0].quantity,unitCost:unit,supplierId,supplierName:supplier?.name||(supplierId===r.supplierId?r.supplierName||'':''),deliveryCost:delivery,totalCost:total,status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
 $('orderSave').disabled=true;fail('');
 try{
 if(status==='received'&&r.requestType==='service_kit_replenishment'){
  try{await db.runTransaction(async tx=>{const ref=db.collection('partRequests').doc(id),old=await tx.get(ref);if(!old.exists||['received','cancelled'].includes(old.data().status))throw Error('Request already closed');tx.update(ref,{...update,receivedAt:firebase.firestore.FieldValue.serverTimestamp()});});toast('Replacement kit received — service job already charged');}catch(e){throw e}
 }else if(status==='received'&&['consumables_tools','stock_replenishment'].includes(r.requestType)){
 try{await db.runTransaction(async tx=>{const stock=r.requestType==='stock_replenishment',accountId=stock?'stock-replenishment':'consumables-tools',accountName=stock?'Stock Replenishment':'Consumables & Tools',orderNumber=stock?'STOCK-001':'CONSUMABLES & TOOLS';const ref=db.collection('partRequests').doc(id),ledger=db.collection('partCostLedger').doc(id),account=db.collection('purchasingAccounts').doc(accountId);const [old,posted]=await Promise.all([tx.get(ref),tx.get(ledger)]);if(!old.exists||['received','cancelled'].includes(old.data().status)||posted.exists)throw Error('Already closed or posted');
 const inventory=[];
 if(stock){
  const grouped=new Map();
  for(const l of lines){const key=cpNorm(l.partNumber);if(!key)throw Error('Stock order requires a part number on every line');const g=grouped.get(key)||{number:l.partNumber,description:l.partName,qty:0,cost:0};g.qty+=l.quantity;g.cost+=l.lineTotal;grouped.set(key,g);}
  for(const [key,g] of grouped){const matches=cpStockParts.filter(p=>cpNorm(p.partNumber)===key);if(matches.length>1)throw Error('Duplicate stock part number: '+g.number);const stockRef=db.collection('stockedParts').doc(matches[0]?.id||'stock-'+key);const snap=await tx.get(stockRef);const previous=snap.exists?snap.data():{};const qty=Number(previous.quantityOnHand||0);const average=Number(previous.averageUnitCost||0);const allocatedDelivery=total>delivery?delivery*g.cost/(total-delivery):delivery*g.qty/lines.reduce((a,l)=>a+l.quantity,0);inventory.push({ref:stockRef,update:{partNumber:previous.partNumber||g.number,description:previous.description||g.description,quantityOnHand:qty+g.qty,minimumStock:previous.minimumStock??2,averageUnitCost:Math.round((qty*average+g.cost+allocatedDelivery)/(qty+g.qty)*10000)/10000,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}});}
 }
 for(const item of inventory)tx.set(item.ref,item.update,{merge:true});
 tx.update(ref,{...update,receivedAt:firebase.firestore.FieldValue.serverTimestamp()});tx.set(ledger,{requestId:id,jobId:orderNumber,jobDocId:accountId,costAccount:r.requestType,machineId:'',machineName:accountName,partName:lines[0].partName,partNumber:lines[0].partNumber,quantity:lines[0].quantity,supplierId:update.supplierId,supplierName:update.supplierName,unitCost:unit,lines,deliveryCost:delivery,totalCost:total,postedAt:firebase.firestore.FieldValue.serverTimestamp()});tx.set(account,{name:accountName,totalCost:firebase.firestore.FieldValue.increment(total),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});});toast('Received — purchasing account cost recorded');}catch(e){throw e}
 }else if(status==='received'){
  try{
   await db.runTransaction(async tx=>{
    const ref=db.collection('partRequests').doc(id),jobRef=db.collection('liveJobs').doc(r.jobDocId),ledgerRef=db.collection('partCostLedger').doc(id);
    const [old,job,ledger]=await Promise.all([tx.get(ref),tx.get(jobRef),tx.get(ledgerRef)]);
    if(!old.exists||['received','cancelled'].includes(old.data().status)||ledger.exists)throw Error('Already received or recorded');
    if(!job.exists)throw Error('Linked job not found: cannot post cost');
    tx.update(ref,{...update,receivedAt:firebase.firestore.FieldValue.serverTimestamp()});
    tx.set(ledgerRef,{requestId:id,jobDocId:r.jobDocId,jobId:r.jobId,machineId:r.machineId,machineName:r.machineName,partName:lines[0].partName,partNumber:lines[0].partNumber,quantity:lines[0].quantity,supplierId:update.supplierId,supplierName:update.supplierName,unitCost:unit,lines,deliveryCost:delivery,totalCost:total,postedAt:firebase.firestore.FieldValue.serverTimestamp()});
    tx.update(jobRef,{partCostTotal:firebase.firestore.FieldValue.increment(total),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   });toast('Received — part cost posted to job');
  }catch(e){throw e;}
 }else{try{await db.runTransaction(async tx=>{const ref=db.collection('partRequests').doc(id),snap=await tx.get(ref);if(!snap.exists||['received','cancelled'].includes(snap.data().status))throw Error('Request already closed');tx.update(ref,update);});toast('Parts request updated')}catch(e){throw e}}
 $('orderModal').hidden=true;editingRequest=null;
 }catch(e){fail(e.message||'Unable to save order');}finally{$('orderSave').disabled=false;}
}
async function cpCancelRequest(id){if(!backOfficeUnlocked)return toast('Manager sign-in required');const r=cpPartRequests.find(x=>x.id===id);if(!r||r.status==='received')return;if(!confirm('Cancel this parts request?'))return;try{await db.collection('partRequests').doc(id).update({status:'cancelled',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){toast(e.message)}}
async function cpEditSupplier(id){if(!backOfficeUnlocked)return toast('Manager sign-in required');
 const old=cpSuppliers.find(x=>x.id===id)||{};
 const name=prompt('Supplier company name *',old.name||'');if(name===null||!name.trim())return;
 const contact=prompt('Contact person',old.contact||'');if(contact===null)return;
 const phone=prompt('Telephone',old.phone||'');if(phone===null)return;
 const email=prompt('Email',old.email||'');if(email===null)return;
 const website=prompt('Website',old.website||'');if(website===null)return;
 const notes=prompt('Supplier notes / account reference',old.notes||'');if(notes===null)return;
 try{await db.collection('partSuppliers').doc(id||db.collection('partSuppliers').doc().id).set({name:name.trim(),contact,phone,email,website,notes,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('Supplier saved');}catch(e){toast(e.message)}
}
async function cpDeleteSupplier(id){if(!backOfficeUnlocked)return toast('Manager sign-in required');if(!confirm('Remove supplier from directory? Historical orders retain the supplier name.'))return;try{await db.collection('partSuppliers').doc(id).delete()}catch(e){toast(e.message)}}
async function cpAddStock(){if(!backOfficeUnlocked)return;const number=prompt('Stocked part number *');if(!number?.trim()||!cpNorm(number))return;if(cpIsStocked(number))return toast('Already in stock register');const description=prompt('Description of stocked item','');if(description===null)return;const ref=db.collection('stockedParts').doc('stock-'+cpNorm(number));try{await db.runTransaction(async tx=>{const old=await tx.get(ref);if(old.exists)throw Error('Already in stock register');tx.set(ref,{partNumber:number.trim(),description:description.trim(),quantityOnHand:0,minimumStock:2,averageUnitCost:0,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});});}catch(e){toast(e.message)}}
async function cpEditStock(id){if(!backOfficeUnlocked)return;const p=cpStockParts.find(x=>x.id===id);if(!p)return;const raw=prompt('Actual quantity on hand (physical stock count)',String(p.quantityOnHand||0));if(raw===null)return;const minimum=prompt('Low stock warning threshold',String(p.minimumStock??2));if(minimum===null)return;const cost=prompt('Average cost per item (£ ex VAT)',String(p.averageUnitCost||0));if(cost===null)return;const qty=Number(raw),min=Number(minimum),unit=Number(cost);if(!raw.trim()||!minimum.trim()||!cost.trim()||!Number.isSafeInteger(qty)||qty<0||!Number.isSafeInteger(min)||min<0||!Number.isFinite(unit)||unit<0)return toast('Enter valid non-negative quantity, minimum and cost');try{const ref=db.collection('stockedParts').doc(id);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists||Number(snap.data().quantityOnHand||0)!==Number(p.quantityOnHand||0)||Number(snap.data().averageUnitCost||0)!==Number(p.averageUnitCost||0)||Number(snap.data().minimumStock??2)!==Number(p.minimumStock??2))throw Error('Stock changed; reopen adjustment');tx.update(ref,{quantityOnHand:qty,minimumStock:min,averageUnitCost:unit,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});});toast('Stock count and threshold updated');}catch(e){toast(e.message)}}
async function cpRemoveStock(id){if(!backOfficeUnlocked)return;if(!confirm('Remove zero-quantity stocked part from stock register?'))return;try{const ref=db.collection('stockedParts').doc(id);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists||Number(snap.data().quantityOnHand||0)!==0)throw Error('Only zero-quantity stock can be removed');tx.delete(ref);});}catch(e){toast(e.message)}}
function cpRenderKitRegister(){
 const sel=document.getElementById('cpKitMachine'),list=document.getElementById('cpKitRegister');if(!sel||!list)return;
 const old=sel.value;sel.innerHTML='<option value="">Select machine...</option>'+machines.map(m=>'<option value="'+cpEsc(m.id)+'">'+cpEsc(m.name)+' — '+cpEsc(m.serialNumber||'')+'</option>').join('');sel.value=old;
 list.innerHTML=machines.map(m=>'<div style="padding:8px;border-bottom:1px solid #ddd"><b>'+cpEsc(m.name)+'</b> — '+(m.serviceKit?.name?cpEsc(m.serviceKit.name)+' | '+cpEsc(m.serviceKit.partNumber||'')+' | '+cpMoney(m.serviceKit.cost):'Not configured')+'</div>').join('');
}
async function cpEditServiceKit(){
 if(!backOfficeUnlocked)return toast('Manager sign-in required');
 const m=machines.find(x=>x.id===document.getElementById('cpKitMachine').value);if(!m)return toast('Select a machine');
 const k=m.serviceKit||{},name=prompt('Service kit description',k.name||m.name+' service kit');if(name===null||!name.trim())return;
 const partNumber=prompt('Service kit part number (optional)',k.partNumber||'');if(partNumber===null)return;
 const price=prompt('Saved cost per kit (£ excluding VAT)',k.cost==null?'':String(k.cost));if(price===null)return;
 const cost=Number(price);if(!price.trim()||!Number.isFinite(cost)||cost<0)return toast('Enter a valid saved kit cost');
 const supplier=prompt('Preferred supplier (optional):\n'+cpSuppliers.map((p,i)=>(i+1)+'. '+p.name).join('\n')+'\nLeave blank to retain existing supplier.','');if(supplier===null)return;
 const p=cpSuppliers[Number(supplier)-1];if(supplier.trim()&&!p)return toast('Invalid supplier selection');
 try{await db.collection('machines').doc(m.id).update({serviceKit:{name:name.trim(),partNumber:partNumber.trim(),cost:Math.round(cost*100)/100,supplierId:p?.id||k.supplierId||'',supplierName:p?.name||k.supplierName||''}});toast('Service kit saved');}catch(e){toast(e.message)}
}
